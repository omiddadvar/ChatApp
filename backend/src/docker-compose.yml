version: '3.9'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: chatapp-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql/data
    networks:
      - chatapp-net
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${MSSQL_SA_PASSWORD}", "-Q", "SELECT 1", "-C"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  mongo:
    image: mongodb/mongodb-community-server:9.0-ubi9-slim
    container_name: chatapp-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USER}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD}"
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - chatapp-net

  chatapp.api:
    image: ${DOCKER_REGISTRY-}chatappapi
    container_name: chatapp-api
    build:
      context: ../backend
      dockerfile: ChatApp.API/Dockerfile
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      mongo:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=ChatApp;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
      ConnectionStrings__IdentityDb: "Server=sqlserver,1433;Database=ChatApp_Identity;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
      ConnectionStrings__NotificationDb: "Server=sqlserver,1433;Database=ChatApp_Notification;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
      Mongo__ConnectionString: "mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017"
      Mongo__DatabaseName: "ChatApp_Chat"
      Jwt__Issuer: "ChatApp"
      Jwt__Audience: "ChatApp.Client"
      Jwt__SigningKey: "${JWT_SIGNING_KEY}"
    ports:
      - "5000:8080"
      - "5001:8081"
    networks:
      - chatapp-net

volumes:
  sqlserver_data:
    driver: local
  mongo_data:
    driver: local

networks:
  chatapp-net:
    driver: bridge